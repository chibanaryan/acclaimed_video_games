{# Mobile Genre Filter - Hierarchical Tree with Wikipedia Genres #}
{# Assumes parent has filters.genres (array, single-select), and genres (list) from main Alpine.js state #}
{% load static %}

<div x-data="{
        expanded: true,
        expandedCategories: {},

        // Get root categories (level 0), sorted by total game count (descending)
        get rootCategories() {
            return genres.filter(g => g.level === 0).sort((a, b) => {
                // Sort by total game count of children (descending)
                const aCount = this.getCategoryTotalGameCount(a.id);
                const bCount = this.getCategoryTotalGameCount(b.id);
                return bCount - aCount;
            });
        },

        // Get total game count for a category (sum of all children's game_count)
        getCategoryTotalGameCount(categoryId) {
            const children = genres.filter(g => String(g.parent_id) === String(categoryId));
            return children.reduce((sum, c) => sum + (c.game_count || 0), 0);
        },

        // Get child genres for a parent, sorted by game count (descending)
        getChildren(parentId) {
            return genres.filter(g => String(g.parent_id) === String(parentId)).sort((a, b) => {
                // Sort by game_count (descending)
                return (b.game_count || 0) - (a.game_count || 0);
            });
        },

        // Get total filtered count for a category (sum of all children's effective count)
        getCategoryTotalCount(categoryId) {
            const children = this.getChildren(categoryId);
            return children.reduce((sum, c) => sum + this.getEffectiveCount(c), 0);
        },

        // Category icons mapping
        categoryIcons: {
            'Action': 'mdi-sword-cross',
            'Adventure': 'mdi-compass',
            'Role-Playing': 'mdi-wizard-hat',
            'Strategy': 'mdi-chess-knight',
            'Simulation': 'mdi-airplane',
            'Sports': 'mdi-basketball',
            'Puzzle': 'mdi-puzzle',
            'Party & Casual': 'mdi-party-popper',
            'Hybrid & Specialized': 'mdi-star-four-points'
        },

        getCategoryIcon(name) {
            return this.categoryIcons[name] || 'mdi-gamepad-variant';
        },

        isGenreSelected(genreId) {
            return filters.genres.includes(String(genreId));
        },

        // Check if the category itself is selected (parent level)
        isCategorySelected(categoryId) {
            return filters.genres.includes(String(categoryId));
        },

        // Toggle individual genre (single-select)
        toggleGenre(genreId) {
            const id = String(genreId);
            if (filters.genres.includes(id)) {
                filters.genres = [];  // Deselect
            } else {
                filters.genres = [id];  // Replace with single selection
            }
        },

        // Toggle parent category selection (single-select)
        toggleCategorySelection(categoryId) {
            const id = String(categoryId);
            if (filters.genres.includes(id)) {
                filters.genres = [];  // Deselect
            } else {
                filters.genres = [id];  // Replace with single selection
                // Expand the category when selecting
                this.expandedCategories[categoryId] = true;
            }
        },

        selectedCount() {
            return filters.genres.length;
        },

        clearGenres() {
            filters.genres = [];
        },

        // Category management
        isCategoryExpanded(categoryId) {
            // Default to expanded if category or any child selected
            if (this.expandedCategories[categoryId] === undefined) {
                return this.isCategorySelected(categoryId) || this.hasSelectedChildren(categoryId);
            }
            return this.expandedCategories[categoryId];
        },

        toggleCategoryExpansion(categoryId) {
            this.expandedCategories[categoryId] = !this.isCategoryExpanded(categoryId);
        },

        // Check if any child of a category is selected
        hasSelectedChildren(categoryId) {
            const children = this.getChildren(categoryId);
            const childIds = children.map(c => String(c.id));
            return childIds.some(id => filters.genres.includes(id));
        },

        // Check if category or any children selected (for visual indication)
        hasCategoryOrChildrenSelected(categoryId) {
            return this.isCategorySelected(categoryId) || this.hasSelectedChildren(categoryId);
        },

        getEffectiveCount(genre) {
            return genre.filtered_count !== undefined ? genre.filtered_count : genre.game_count;
        }
     }"
     @genres-reset.window="filters.genres = [];"
     class="space-y-3">

    {# Accordion Header #}
    <div class="flex items-center gap-3 w-full text-base font-semibold">
        <button type="button"
                @click="expanded = !expanded"
                class="flex items-center gap-2">
            <span class="mdi mdi-gamepad-variant text-lg text-base-content/60"></span>
            Genres
            <span class="mdi mdi-chevron-right text-xl transition-transform duration-200" :class="{ 'rotate-90': expanded }"></span>
        </button>
        <template x-if="selectedCount() > 0">
            <span class="badge badge-primary badge-sm" x-text="selectedCount() + ' selected'"></span>
        </template>
        <div class="flex-1"></div>
        <button type="button"
                x-show="selectedCount() > 0"
                x-cloak
                @click.stop="clearGenres(); debouncedFilterUpdate();"
                class="btn btn-ghost btn-xs ml-2">
            <span class="mdi mdi-close text-xs"></span>
            Clear Genre Filter
        </button>
    </div>

    {# Accordion Content #}
    <div x-show="expanded"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="space-y-4">

        {# Genre Categories - Hierarchical #}
        <div class="space-y-3">
            <template x-for="category in rootCategories" :key="category.id">
                <div class="space-y-2">
                    <div class="flex items-center gap-2 py-1 px-2 rounded-lg"
                         :class="{
                             'bg-primary/10': hasCategoryOrChildrenSelected(category.id)
                         }">
                        {# Checkbox to select category (selects category ID itself) #}
                        <label class="cursor-pointer" @click.stop>
                            <input type="checkbox"
                                   :checked="isCategorySelected(category.id)"
                                   @change="toggleCategorySelection(category.id); debouncedFilterUpdate();"
                                   class="checkbox checkbox-sm checkbox-primary">
                        </label>

                        {# Button to expand/collapse category #}
                        <button type="button"
                                @click="toggleCategoryExpansion(category.id)"
                                class="flex items-center gap-2 flex-1">
                            <span class="mdi" :class="getCategoryIcon(category.name)"></span>
                            <span x-text="category.name" class="text-sm font-medium"></span>
                        </button>

                        {# Game count #}
                        <span class="text-xs opacity-50 tabular-nums" x-text="getCategoryTotalCount(category.id)"></span>

                        {# Expand/collapse arrow #}
                        <button type="button"
                                @click="toggleCategoryExpansion(category.id)"
                                class="p-1">
                            <span class="mdi mdi-chevron-right text-base transition-transform duration-200" :class="{ 'rotate-90': isCategoryExpanded(category.id) }"></span>
                        </button>
                    </div>

                    {# Child genres for this category #}
                    <div x-show="isCategoryExpanded(category.id)"
                         x-transition:enter="transition ease-out duration-200"
                         x-transition:enter-start="opacity-0 -translate-y-1"
                         x-transition:enter-end="opacity-100 translate-y-0"
                         class="pl-6 space-y-1">
                        <template x-for="genre in getChildren(category.id)" :key="genre.id">
                            <div class="flex items-center gap-2 py-1 cursor-pointer"
                                 :class="{ 'bg-primary/10 rounded-lg px-2 -mx-2': isGenreSelected(genre.id) }"
                                 @click="toggleGenre(genre.id); debouncedFilterUpdate();">
                                <input type="checkbox"
                                       :value="genre.id"
                                       :checked="isGenreSelected(genre.id)"
                                       @click.stop
                                       @change="toggleGenre(genre.id); debouncedFilterUpdate();"
                                       class="checkbox checkbox-xs checkbox-primary">
                                <span class="text-sm flex-1" x-text="genre.name"></span>
                                {# Game count #}
                                <span class="text-xs opacity-50 tabular-nums" x-text="getEffectiveCount(genre)"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
