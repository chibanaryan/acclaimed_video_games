repos:
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: local
    hooks:
      - id: django-coverage
        name: Run Django coverage
        entry: bash -c "source venv/bin/activate && DATABASE_URL=sqlite:///db.sqlite3 CACHE_URL=locmemcache:// CORS_ALLOWED_ORIGINS=http://localhost coverage run --source=games manage.py test games.tests && coverage report --fail-under=95"
        language: system
        pass_filenames: false
      - id: django-tests
        name: Run Django test suite
        entry: scripts/run_tests.sh
        language: system
        pass_filenames: false
