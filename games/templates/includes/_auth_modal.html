{# Auth Modal - modal-based authentication flow #}
<dialog id="authModal" class="modal">
    <div class="modal-box bg-base-200 max-w-md">
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
                aria-label="close"
                onclick="this.closest('dialog').close()">
            <span class="mdi mdi-close"></span>
        </button>
        <div id="auth-modal-content">
            {# Initial content - auth options #}
            {% include 'auth/partials/_auth_options.html' %}
        </div>
    </div>
    <div class="modal-backdrop" onclick="document.getElementById('authModal').close()"></div>
</dialog>
