{% extends 'games/base.html' %}

{% load games_tags %}

{% block content %}
<div class="block">
    <h1 class="title is-1">Acclaimed Video Games</h1>
    <div class="columns">
        <div class="column">
            <p class="is-size-4">
                {% snippet 'front-page' %}
            </p>
            <h3 class="title is-3 mt-5">Current Top 10</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Game</th>
                    </tr>
                </thead>
                <tbody>
                    {% for game in games %}
                        <tr>
                            <td>
                                {{ game.rank }}
                            </td>
                            <td>
                                <a href="{% url 'games-list' %}?highlight={{ game.id }}">
                                    {{ game }}
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
            <p class="is-size-5">
                Last update: 12th March 2023
            </p>
        </div>
        <div class="column">
    </div>
</div>
{% endblock %}
