{% extends 'base.html' %}
{% load game_filters %}

{% block title %}News - Acclaimed Games{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
<h1 class="text-3xl font-bold mb-6">News</h1>

{% include 'posts/includes/_post_list_results.html' %}
</div>

<script nonce="{{ csp_nonce }}">
// Generic Load More handler for posts
function initPostLoadMore() {
    const button = document.querySelector('.load-more-button');
    if (!button) return;

    // Remove existing listener to prevent duplicates after DOM updates
    const newButton = button.cloneNode(true);
    button.parentNode.replaceChild(newButton, button);
    newButton.addEventListener('click', handlePostLoadMore);
}

async function handlePostLoadMore(event) {
    const button = event.currentTarget;
    const nextPage = button.dataset.nextPage;

    if (!nextPage || button.classList.contains('loading')) return;

    // Set loading state
    button.classList.add('loading');
    button.disabled = true;

    // Build URL with current filters + next page + append flag
    const params = new URLSearchParams(window.location.search);
    params.set('page', nextPage);
    params.set('append', 'true');

    const url = window.location.pathname + '?' + params.toString();

    try {
        const response = await fetch(url, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'HX-Request': 'true'
            }
        });

        if (!response.ok) throw new Error('Failed to load more');

        const html = await response.text();

        // Parse the response to separate posts from metadata
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract metadata
        const metaScript = doc.getElementById('load-more-meta');
        const meta = metaScript ? JSON.parse(metaScript.textContent) : null;

        // Remove the metadata script from the parsed doc
        if (metaScript) metaScript.remove();

        // Append posts to container
        const postContainer = document.getElementById('post-list-container');
        const appendContainer = doc.getElementById('append-posts-container');
        if (postContainer && appendContainer) {
            const newPosts = appendContainer.children;
            while (newPosts.length > 0) {
                postContainer.appendChild(newPosts[0]);
            }
        }

        // Update button
        if (meta) {
            button.classList.remove('loading');

            if (!meta.hasMore) {
                const container = button.parentElement;
                container.innerHTML = `
                    <div class="text-base-content/70 text-center">
                        All ${meta.totalCount.toLocaleString()} posts loaded
                    </div>
                `;
            } else {
                button.disabled = false;
                button.dataset.nextPage = meta.nextPage;
                button.dataset.loaded = meta.loadedCount;

                const textSpan = button.querySelector('.load-more-text');
                if (textSpan) {
                    textSpan.textContent = `Load More (${meta.remainingCount.toLocaleString()} remaining)`;
                }
            }
        }

    } catch (err) {
        console.error('Load more error:', err);
        button.classList.remove('loading');
        button.disabled = false;
    }
}

// Initialize on page load (handle case where DOMContentLoaded already fired)
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPostLoadMore);
} else {
    initPostLoadMore();
}
</script>
{% endblock %}
