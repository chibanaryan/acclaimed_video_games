{% extends 'games/base.html' %}

{% block title %} - Developers{% endblock %}

{% block content %}
    <h1 class="title">Developers</h1>
    <table class="table is-fullwidth">
        <thead>
            <tr>
                <th>Name</th>
                <th># Games</th>
            </tr>
        </thead>
        <tbody>
            {% for developer in developeralias_list %}
                <tr>
                    <td>
                        <a href="{% url 'developer-alias-redirect' developer.pk %}">
                            {{ developer }}
                        </a>
                    </td>
                    <td>
                        {{ developer.games_count }}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
