{# PostItem component #}
{# Props: post #}
{% load game_filters %}

<div class="is-clearfix my-5 box">
    <h4 class="title is-size-5">{{ post.title }}</h4>
    <div class="content">{{ post.text_rendered|safe }}</div>
    <div class="has-text-grey-dark is-pulled-right">{{ post.date|from_now }}</div>
</div>
