{# Post list results partial - used for both initial render and HTMX updates #}
{% load humanize %}
{% if posts %}
<div id="post-list-container">
    {% for post in posts %}
        {% include 'posts/includes/_post_item.html' with post=post %}
    {% endfor %}
</div>

{% if has_more %}
<div id="load-more-container" class="text-center my-6">
    <button type="button"
            class="btn btn-ghost load-more-button"
            data-next-page="{{ next_page }}"
            data-total="{{ total_count }}"
            data-loaded="{{ loaded_count }}">
        <span class="mdi mdi-space-invaders"></span>
        <span class="load-more-text">Load More ({{ remaining_count|intcomma }} remaining)</span>
    </button>
</div>
{% endif %}

{% else %}
<div class="alert">
    <span class="mdi mdi-information-outline"></span>
    <span>No posts found.</span>
</div>
{% endif %}
