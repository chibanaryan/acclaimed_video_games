{# SearchInput component - using DaisyUI label pattern #}
{# Props: placeholder (optional), id (optional), name (optional) #}
{# Uses Alpine.js for interactivity - operates within parent Alpine.js scope (expects filters.q) #}
<label class="input input-bordered w-full bg-base-100">
    <svg class="h-4 w-4 opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
        </g>
    </svg>
    <input class="grow"
           {% if id %}id="{{ id }}"{% endif %}
           {% if name %}name="{{ name }}"{% else %}name="q"{% endif %}
           x-model="filters.q"
           @keyup.enter="updateUrlAndResults()"
           placeholder="{% if placeholder %}{{ placeholder }}{% else %}Search{% endif %}"
           autocomplete="off">
    <button type="button"
            @click="filters.q = ''"
            title="Clear search"
            class="btn btn-ghost btn-xs btn-circle"
            style="display: none"
            :style="{ display: filters.q && filters.q.length > 0 ? 'flex' : 'none' }"
            aria-label="Clear search">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
            </g>
        </svg>
    </button>
</label>
