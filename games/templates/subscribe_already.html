{% extends 'base.html' %}

{% block title %}Already Subscribed | Acclaimed Video Games{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card bg-base-100 shadow-xl max-w-md w-full">
        <div class="card-body items-center text-center">
            {# Check Icon #}
            <div class="text-6xl text-success mb-4">
                <span class="mdi mdi-check-circle"></span>
            </div>

            <h1 class="card-title text-2xl mb-4">Already Subscribed</h1>

            <p class="text-base-content/85 mb-4">
                You're already subscribed to our updates. We'll let you know when we publish new content.
            </p>

            <div class="card-actions mt-4">
                <a href="{% url 'home' %}" class="btn btn-outline">
                    <span class="mdi mdi-home mr-2"></span>
                    Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
