[pytest]
DJANGO_SETTINGS_MODULE = acclaimedgames.settings
python_files = test_*.py
testpaths = games/tests books/tests core/tests
# Run tests for all apps, but enforce 95% coverage only on games (books/core are still developing)
addopts = -n auto --cov=games --cov-fail-under=95 --cov-report=term-missing:skip-covered
