{# PostItem component #}
{# Props: post #}
{% load game_filters %}

<div class="card bg-base-200 shadow-sm my-4">
    <div class="card-body p-4">
        <h4 class="card-title text-lg">{{ post.title }}</h4>
        <div class="prose prose-sm prose-invert max-w-none">{{ post.text_rendered|safe }}</div>
        <div class="text-base-content/85 text-sm text-right mt-2">
            {% if post.author %}{{ post.author.get_full_name|default:post.author.username }} · {% endif %}{{ post.date|from_now }}
        </div>
    </div>
</div>
