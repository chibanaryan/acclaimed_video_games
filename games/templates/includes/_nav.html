{% load static %}
<nav class="navbar" role="navigation" aria-label="main navigation" x-data="{ expanded: false, mobileSearchActive: false }">
    <div class="navbar-brand">
        <a href="{% url 'home' %}" class="navbar-item has-text-weight-bold pl-0" x-show="!mobileSearchActive">
            <img src="{% static 'games/avg_logo_small.png' %}" alt="Acclaimed Games" width="401" height="263">
        </a>
        {# Mobile search button - appears between logo and Top 1000 on mobile #}
        <div class="navbar-item is-hidden-tablet mobile-search"
             :class="{ 'is-expanded': mobileSearchActive }"
             x-data="{
                 ...createSearchData('{% url 'api-games-search' %}', 5),
                 toggleInput() {
                     mobileSearchActive = !mobileSearchActive;
                     if (mobileSearchActive) {
                         setTimeout(() => {
                             const input = this.$refs.searchInputMobile;
                             if (input) input.focus();
                         }, 100);
                     }
                 }
             }"
             x-init="window.addEventListener('reset-search-state', () => { reset(); mobileSearchActive = false; })">
            <button @click="toggleInput()" x-show="!mobileSearchActive" class="button is-text" aria-label="Open search">
                <span class="icon">
                    <span class="mdi mdi-magnify mdi-24px" aria-hidden="true"></span>
                </span>
            </button>
            <div x-show="mobileSearchActive" x-cloak class="results-wrapper">
                <div class="field has-addons">
                    <div class="control has-icons-left is-expanded">
                        <label for="nav-search-mobile" class="is-sr-only">Search games</label>
                        <span class="icon" aria-hidden="true">
                            <span class="mdi mdi-magnify"></span>
                        </span>
                        <input type="text"
                               id="nav-search-mobile"
                               name="q"
                               x-ref="searchInputMobile"
                               x-model="q"
                               @focus="showMenu = true"
                               @input.debounce.300ms="if(q.trim().length >= 2) { loadResults(); } else { results = []; loading = false; }"
                               @keydown.enter="if(q.trim().length >= 2) window.location.href = '{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())"
                               placeholder="Search all games"
                               class="input input-dark"
                               autocomplete="off">
                    </div>
                    <div class="control">
                        <a @click="mobileSearchActive = false; q = ''; results = []; showMenu = false" class="button" role="button" aria-label="Close search">
                            <span class="icon" aria-hidden="true">
                                <span class="mdi mdi-close"></span>
                            </span>
                        </a>
                    </div>
                </div>
                <div x-show="showMenu" class="results">
                    <template x-if="!q || q.trim().length < 2">
                        <div class="dropdown-item">
                            Please enter two or more characters
                        </div>
                    </template>
                    <template x-if="q && q.trim().length >= 2 && !loading && results.length == 0">
                        <div class="dropdown-item">
                            No results found
                        </div>
                    </template>
                    <template x-for="result in results" :key="result.id">
                        <a :href="'/game/' + result.slug + '/'" class="result dropdown-item">
                            <div class="media">
                                <div class="media-left">
                                    <figure class="image is-32x32">
                                        <img :src="result.thumbnail" :alt="result.name" width="32" height="32">
                                    </figure>
                                </div>
                                <div class="media-content">
                                    <div class="has-text-weight-semibold" x-text="result.name + ' (' + result.year_of_release + ')'"></div>
                                    <div class="has-text-weight-light" x-text="'All time rank: ' + result.rank"></div>
                                </div>
                            </div>
                        </a>
                    </template>
                    <template x-if="q && q.trim().length >= 2 && !loading && results.length > 0">
                        <a :href="'{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())"
                           class="dropdown-item">
                            See all results &hellip;
                        </a>
                    </template>
                </div>
            </div>
        </div>
        {# Desktop search with dropdown - full search functionality #}
        <div class="navbar-item is-hidden-mobile desktop-search"
             x-data="createSearchData('{% url 'api-games-search' %}', 5)"
             x-init="window.addEventListener('reset-search-state', () => reset())"
             @click.away="showMenu = false">
            <div class="dropdown" :class="{ 'is-active': showMenu }">
                <div class="field has-addons m-0">
                    <div class="control has-icons-left">
                        <label for="nav-search-desktop" class="is-sr-only">Search games</label>
                        <span class="icon" aria-hidden="true">
                            <span class="mdi mdi-magnify"></span>
                        </span>
                        <input type="text"
                               id="nav-search-desktop"
                               name="q"
                               placeholder="Search all games"
                               class="input input-dark"
                               x-model="q"
                               @focus="showMenu = true"
                               @input.debounce.300ms="if(q.trim().length >= 2) { loadResults(); } else { results = []; loading = false; }"
                               @keydown.enter="if(q.trim().length >= 2) window.location.href = '{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())"
                               autocomplete="off">
                    </div>
                    <div class="control" x-show="q && q.trim()" x-cloak>
                        <a @click="q = ''; results = []; showMenu = false" class="button" role="button" aria-label="Clear search">
                            <span class="icon" aria-hidden="true">
                                <span class="mdi mdi-close"></span>
                            </span>
                        </a>
                    </div>
                </div>
                <div class="dropdown-menu" x-show="showMenu">
                    <div class="dropdown-content">
                        <template x-if="!q || q.trim().length < 2">
                            <div class="dropdown-item">
                                Please enter two or more characters
                            </div>
                        </template>
                        <template x-if="q && q.trim().length >= 2 && !loading && results.length == 0">
                            <div class="dropdown-item">
                                No results found
                            </div>
                        </template>
                        <template x-for="result in results" :key="result.id">
                            <a :href="'/game/' + result.slug + '/'" class="result dropdown-item">
                                <div class="media">
                                    <div class="media-left">
                                        <figure class="image is-32x32">
                                            <img :src="result.thumbnail" :alt="result.name" width="32" height="32">
                                        </figure>
                                    </div>
                                    <div class="media-content">
                                        <div class="has-text-weight-semibold" x-text="result.name + ' (' + result.year_of_release + ')'"></div>
                                        <div class="has-text-weight-light" x-text="'All time rank: ' + result.rank"></div>
                                    </div>
                                </div>
                            </a>
                        </template>
                        <template x-if="q && q.trim().length >= 2 && !loading && results.length > 0">
                            <a :href="'{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())"
                               class="dropdown-item">
                                See all results &hellip;
                            </a>
                        </template>
                    </div>
                </div>
            </div>
        </div>
        <a href="{% url 'games-list' %}" class="navbar-item nav-link" x-show="!mobileSearchActive">
            Top 1000
        </a>
    </div>
    <div class="navbar-menu" :class="{ 'is-active': expanded }" @click="expanded = false">
        <div class="navbar-start">
            <a href="{% url 'developers-list' %}" class="navbar-item nav-link">Developers</a>
            <a href="{% url 'list-list' %}" class="navbar-item nav-link">Lists</a>
            <a href="{% url 'page-detail' slug='about' %}" class="navbar-item nav-link">About</a>
            <a href="{% url 'page-detail' slug='donate' %}" class="navbar-item nav-link">Donate</a>
            <a href="{% url 'page-detail' slug='palestine' %}" class="navbar-item nav-link" title="Statement on Palestine">
                <span class="icon">
                    <img src="{% static 'games/palestine-flag-xs.png' %}" alt="Palestine" width="24" height="12">
                </span>
            </a>
        </div>
    </div>
    <a @click="expanded = !expanded"
       class="navbar-burger is-hidden-desktop"
       :class="{ 'is-active': expanded }"
       x-show="!mobileSearchActive"
       aria-label="menu"
       :aria-expanded="expanded"
       role="button">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
    </a>
</nav>
