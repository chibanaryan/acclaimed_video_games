{# YearGrid component - Heatmap year selector #}
{# Props: year_counts (list of {year, count}), min_year, max_year #}
{# Uses parent Alpine.js context (filters.start, filters.end) #}
{% load game_filters %}

{# Pass year counts data to Alpine.js via JSON script tag #}
<script type="application/json" id="year-counts-data">{{ year_counts|tojson }}</script>

<div class="year-grid-wrapper"
     x-data="{
         yearCounts: [],
         originalYearCounts: [],  // Store original data for structure
         maxCount: 0,
         originalMaxCount: 0,  // Store original max for consistent intensity scale
         decades: [],
         dragStart: null,
         dragAnchorEnd: null,  // End of initial selection (for decade ranges)
         dragEnd: null,
         isDragging: false,
         isDraggingDecade: false,  // Track if drag started from decade label
         isDraggingToDecade: false,  // Track if currently hovering over a decade
         lastClicked: null,  // Track last clicked year for shift+click ranges
         wasAlreadySelected: false,  // Track if clicked item was already selected (for toggle)

         _yearCountsHandler: null,
         _yearOriginalCountsHandler: null,

         init() {
             // Load year counts from JSON
             const dataEl = document.getElementById('year-counts-data');
             if (dataEl) {
                 this.yearCounts = JSON.parse(dataEl.textContent);
                 this.originalYearCounts = [...this.yearCounts];  // Store original structure
                 this.maxCount = Math.max(...this.yearCounts.map(y => y.count), 1);
                 this.originalMaxCount = this.maxCount;  // Store for consistent intensity
                 this.buildDecades();
             }

             // Listen for original counts update (from CSF initialization with full data)
             // This resets the baseline when page loads with URL filters
             this._yearOriginalCountsHandler = (event) => {
                 if (!Array.isArray(event.detail) || event.detail.length === 0) {
                     console.warn('[YearGrid] Invalid original year counts received:', event.detail);
                     return;
                 }
                 // Update original counts with full unfiltered data
                 this.originalYearCounts = event.detail;
                 this.originalMaxCount = Math.max(...event.detail.map(y => y.count), 1);
                 this.maxCount = this.originalMaxCount;
                 // Don't rebuild decades here - wait for the filtered counts update
             };
             window.addEventListener('year-original-counts-update', this._yearOriginalCountsHandler);

             // Listen for updates when filters change
             // Store handler reference for cleanup on destroy
             this._yearCountsHandler = (event) => {
                 // Validate event.detail is an array with expected structure
                 if (!Array.isArray(event.detail) || event.detail.length === 0) {
                     console.warn('[YearGrid] Invalid year counts received:', event.detail);
                     return;
                 }
                 // Ensure the array has the same years as originalYearCounts
                 // If lengths don't match, something is wrong - use a merged approach
                 if (event.detail.length !== this.originalYearCounts.length) {
                     console.warn('[YearGrid] Year counts length mismatch:', event.detail.length, 'vs', this.originalYearCounts.length);
                     // Build a complete array using original structure with new counts
                     const newCountMap = {};
                     event.detail.forEach(yc => {
                         if (yc && typeof yc.year === 'number') {
                             newCountMap[yc.year] = yc.count || 0;
                         }
                     });
                     this.yearCounts = this.originalYearCounts.map(yc => ({
                         year: yc.year,
                         count: newCountMap[yc.year] !== undefined ? newCountMap[yc.year] : 0
                     }));
                 } else {
                     this.yearCounts = event.detail;
                 }
                 // Keep originalMaxCount for consistent intensity scale
                 this.maxCount = this.originalMaxCount;
                 this.buildDecades();
             };
             window.addEventListener('year-counts-update', this._yearCountsHandler);
         },
         destroy() {
             // Clean up event listeners when component is destroyed
             if (this._yearCountsHandler) {
                 window.removeEventListener('year-counts-update', this._yearCountsHandler);
             }
             if (this._yearOriginalCountsHandler) {
                 window.removeEventListener('year-original-counts-update', this._yearOriginalCountsHandler);
             }
         },
         handleReset() {
             this.lastClicked = null;
         },

         buildDecades() {
             // Build structure from ORIGINAL data (decades always visible)
             // All years in a decade are shown (dimmed if 0 results in current filters)
             const currentCountMap = {};
             this.yearCounts.forEach(yc => {
                 currentCountMap[yc.year] = yc.count;
             });

             // Build map of original counts for availability checking
             const originalCountMap = {};
             this.originalYearCounts.forEach(yc => {
                 originalCountMap[yc.year] = yc.count;
             });

             // Group years into decades from original data (newest first)
             const decadeMap = {};
             this.originalYearCounts.forEach(yc => {
                 const decadeStart = Math.floor(yc.year / 10) * 10;
                 if (!decadeMap[decadeStart]) {
                     decadeMap[decadeStart] = {};
                 }

                 const position = yc.year % 10;
                 const currentCount = currentCountMap[yc.year] || 0;
                 const originalCount = yc.count || 0;

                 // Always include years, track availability based on current filter results
                 decadeMap[decadeStart][position] = {
                     year: yc.year,
                     count: currentCount,
                     originalCount: originalCount,
                     available: currentCount > 0  // Has games in current filters
                 };
                 // Track max position for decade width
                 if (!decadeMap[decadeStart].maxOriginalPos || position > decadeMap[decadeStart].maxOriginalPos) {
                     decadeMap[decadeStart].maxOriginalPos = position;
                 }
             });

             // Sort decades descending (newest first)
             const decadeStarts = Object.keys(decadeMap).map(Number).sort((a, b) => b - a);
             this.decades = decadeStarts.map(ds => {
                 // Use original max position to maintain consistent decade width
                 const maxPos = decadeMap[ds].maxOriginalPos || 0;
                 // Create cells for all positions up to maxPos
                 const cells = [];
                 for (let i = 0; i < 10; i++) {
                     if (i > maxPos) {
                         cells.push({ hidden: true });  // Invisible spacer for future years
                     } else if (decadeMap[ds][i]) {
                         cells.push(decadeMap[ds][i]);  // Year with data
                     } else {
                         // Year with no games in original data - show as unavailable
                         const year = ds + i;
                         const currentCount = currentCountMap[year] || 0;
                         cells.push({
                             year: year,
                             count: currentCount,
                             originalCount: 0,
                             available: false  // No games in original data
                         });
                     }
                 }
                 return {
                     start: ds,
                     label: ds + 's',
                     cells: cells
                 };
             });
         },

         // Check if a year is available (has games in current filters)
         isYearAvailable(year) {
             const yearData = this.yearCounts.find(yc => yc.year === year);
             return yearData && yearData.count > 0;
         },

         getOpacity(count) {
             if (count === 0) return '5%';
             // Linear scaling
             const normalized = count / this.maxCount;
             const opacity = 0.30 + normalized * 0.70;
             return Math.round(opacity * 100) + '%';
         },

         getYearLabel(year) {
             return String(year).slice(-2);
         },

         isInRange(year) {
             if (this.isDragging) {
                 // Include anchor range (dragStart to dragAnchorEnd) and current position (dragEnd)
                 const min = Math.min(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 const max = Math.max(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 return year >= min && year <= max;
             }
             // Don't show selection when full range is selected (show heatmap instead)
             if (filters.start === {{ min_year }} && filters.end === {{ max_year }}) {
                 return false;
             }
             return year >= filters.start && year <= filters.end;
         },

         isDecadeSelected(decadeStart) {
             // Don't show previous selection while dragging
             if (this.isDragging) return false;
             // Don't show decade as selected when full range is selected
             if (filters.start === {{ min_year }} && filters.end === {{ max_year }}) {
                 return false;
             }
             // Check if selection aligns with decade boundaries (start ends in 0, end ends in 9)
             const isDecadeAligned = filters.start % 10 === 0 && filters.end % 10 === 9;
             if (!isDecadeAligned) return false;
             // Highlight if this decade is fully contained in the selection
             return decadeStart >= filters.start && decadeStart + 9 <= filters.end;
         },

         isDecadeInDragRange(decadeStart) {
             // Only highlight decades when dragging from a decade label
             if (!this.isDragging || !this.isDraggingDecade) return false;

             // If dragging to a year (not a decade), only highlight starting decade
             if (!this.isDraggingToDecade) {
                 return decadeStart === this.dragStart;
             }

             // Dragging decade-to-decade: highlight all decades in range
             const min = Math.min(this.dragStart, this.dragEnd);
             const max = Math.max(this.dragStart, this.dragEnd);
             return decadeStart >= min && decadeStart <= max;
         },

         selectDecade(decadeStart, event) {
             // Shift+click creates a range from last clicked year/decade
             if (event && event.shiftKey && this.lastClicked !== null) {
                 filters.start = Math.min(this.lastClicked, decadeStart);
                 filters.end = Math.max(this.lastClicked, decadeStart + 9);
                 if (initialized) debouncedFilterUpdate();
             } else if (this.wasAlreadySelected) {
                 // Toggle off if clicking already selected decade
                 filters.start = {{ min_year }};
                 filters.end = {{ max_year }};
                 this.lastClicked = null;
                 this.wasAlreadySelected = false;
                 if (initialized) debouncedFilterUpdate();
             } else {
                 // Just update lastClicked (endDrag already set the filters)
                 this.lastClicked = decadeStart;
             }
         },

         startDragDecade(decadeStart, event) {
             event.preventDefault();
             this.isDragging = true;
             this.isDraggingDecade = true;
             this.isDraggingToDecade = true;
             this.dragStart = decadeStart;
             this.dragAnchorEnd = decadeStart + 9;
             this.dragEnd = decadeStart + 9;
             // Check if this decade was already selected (for toggle on click)
             this.wasAlreadySelected = (filters.start === decadeStart && filters.end === decadeStart + 9);
             this.dispatchPreview();
         },

         updateDragDecade(decadeStart) {
             if (this.isDragging) {
                 this.isDraggingToDecade = true;
                 // Use decade start if dragging to earlier decades, decade end if later
                 if (decadeStart < this.dragStart) {
                     this.dragEnd = decadeStart;  // Include full earlier decade
                 } else {
                     this.dragEnd = decadeStart + 9;  // Include full later decade
                 }
                 this.dispatchPreview();
             }
         },

         selectYear(year, event) {
             // Shift+click creates a range from last clicked year
             if (event && event.shiftKey && this.lastClicked !== null) {
                 filters.start = Math.min(this.lastClicked, year);
                 filters.end = Math.max(this.lastClicked, year);
                 if (initialized) debouncedFilterUpdate();
             } else if (this.wasAlreadySelected) {
                 // Toggle off if clicking already selected year
                 filters.start = {{ min_year }};
                 filters.end = {{ max_year }};
                 this.lastClicked = null;
                 this.wasAlreadySelected = false;
                 if (initialized) debouncedFilterUpdate();
             } else {
                 // Just update lastClicked (endDrag already set the filters)
                 this.lastClicked = year;
             }
         },

         startDrag(year, event) {
             event.preventDefault();
             this.isDragging = true;
             this.dragStart = year;
             this.dragAnchorEnd = year;
             this.dragEnd = year;
             // Check if this year was already selected (for toggle on click)
             this.wasAlreadySelected = (filters.start === year && filters.end === year);
             this.dispatchPreview();
         },

         updateDrag(year) {
             if (this.isDragging) {
                 this.isDraggingToDecade = false;
                 this.dragEnd = year;
                 this.dispatchPreview();
             }
         },

         endDrag() {
             if (this.isDragging) {
                 // Use full anchor range plus current position
                 filters.start = Math.min(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 filters.end = Math.max(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 if (initialized) debouncedFilterUpdate();
             }
             this.isDragging = false;
             this.isDraggingDecade = false;
             this.isDraggingToDecade = false;
             this.dragStart = null;
             this.dragAnchorEnd = null;
             this.dragEnd = null;
             // Clear year preview
             window.dispatchEvent(new CustomEvent('year-preview', { detail: { active: false } }));
         },

         cancelDrag() {
             this.isDragging = false;
             this.isDraggingDecade = false;
             this.isDraggingToDecade = false;
             this.dragStart = null;
             this.dragAnchorEnd = null;
             this.dragEnd = null;
             // Clear year preview
             window.dispatchEvent(new CustomEvent('year-preview', { detail: { active: false } }));
         },

         // Dispatch preview event during drag
         dispatchPreview() {
             if (this.isDragging) {
                 const min = Math.min(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 const max = Math.max(this.dragStart, this.dragAnchorEnd, this.dragEnd);
                 window.dispatchEvent(new CustomEvent('year-preview', {
                     detail: { active: true, start: min, end: max }
                 }));
             }
         },

         // Get total game count for a decade
         getDecadeCount(decade) {
             return decade.cells
                 .filter(c => c && c.year && !c.hidden)
                 .reduce((sum, c) => sum + (c.count || 0), 0);
         },

         // Check if a year exists in the grid
         yearExists(year) {
             return this.originalYearCounts.some(yc => yc.year === year);
         },

         // Adjacency checks for year cells - used to determine which corners should be sharp
         hasSelectedAbove(year) {
             const aboveYear = year + 10;  // Same position in newer decade (visually above)
             return this.yearExists(aboveYear) && this.isInRange(aboveYear);
         },
         hasSelectedBelow(year) {
             const belowYear = year - 10;  // Same position in older decade (visually below)
             return this.yearExists(belowYear) && this.isInRange(belowYear);
         },
         hasSelectedRight(year) {
             const position = year % 10;
             if (position === 9) return false;  // Rightmost in row, no tile to right
             return this.yearExists(year + 1) && this.isInRange(year + 1);
         },
         hasSelectedLeft(year) {
             const position = year % 10;
             if (position === 0) {
                 // First year in decade - check if decade label is selected
                 const decadeStart = Math.floor(year / 10) * 10;
                 return this.isDecadeSelected(decadeStart) || this.isDecadeInDragRange(decadeStart);
             }
             return this.isInRange(year - 1);
         },

         // Adjacency checks for decade labels
         decadeHasSelectedAbove(decadeStart) {
             const aboveDecade = decadeStart + 10;
             return this.isDecadeSelected(aboveDecade) || this.isDecadeInDragRange(aboveDecade);
         },
         decadeHasSelectedBelow(decadeStart) {
             const belowDecade = decadeStart - 10;
             return this.isDecadeSelected(belowDecade) || this.isDecadeInDragRange(belowDecade);
         },
         decadeHasSelectedRight(decadeStart) {
             // Check if first year of this decade is in range
             return this.isInRange(decadeStart);
         }
     }"
     @mouseleave="cancelDrag()"
     @mouseup.window="endDrag()"
     @year-reset.window="handleReset()">

    <div class="year-grid">
        <template x-for="decade in decades" :key="decade.start">
            <div class="year-grid-row">
                {# Decade label - clickable to select entire decade, draggable for ranges #}
                <div class="year-grid-decade"
                     :class="{
                         'is-selected': isDecadeSelected(decade.start) || isDecadeInDragRange(decade.start),
                         'sharp-top': (isDecadeSelected(decade.start) || isDecadeInDragRange(decade.start)) && decadeHasSelectedAbove(decade.start),
                         'sharp-bottom': (isDecadeSelected(decade.start) || isDecadeInDragRange(decade.start)) && decadeHasSelectedBelow(decade.start),
                         'sharp-right': (isDecadeSelected(decade.start) || isDecadeInDragRange(decade.start)) && decadeHasSelectedRight(decade.start)
                     }"
                     @mousedown="startDragDecade(decade.start, $event)"
                     @mouseenter="updateDragDecade(decade.start)"
                     @click.stop="if (!isDragging || (dragStart === decade.start && dragEnd === decade.start + 9)) selectDecade(decade.start, $event)"
                     :title="decade.label + ': ' + getDecadeCount(decade) + ' games'">
                    <span x-text="decade.label"></span>
                </div>

                {# Year cells - positioned by column (0-9) #}
                <template x-for="(cell, idx) in decade.cells" :key="decade.start + '-' + idx">
                    <div class="year-grid-cell"
                         :class="{
                             'is-selected': cell && cell.year && isInRange(cell.year),
                             'is-dragging': cell && cell.year && isDragging && isInRange(cell.year),
                             'sharp-top': cell && cell.year && isInRange(cell.year) && hasSelectedAbove(cell.year),
                             'sharp-bottom': cell && cell.year && isInRange(cell.year) && hasSelectedBelow(cell.year),
                             'sharp-left': cell && cell.year && isInRange(cell.year) && hasSelectedLeft(cell.year),
                             'sharp-right': cell && cell.year && isInRange(cell.year) && hasSelectedRight(cell.year),
                             'year-grid-cell-empty': !cell,
                             'year-grid-cell-hidden': cell && cell.hidden,
                             'is-unavailable': cell && cell.year && !cell.available && !isInRange(cell.year)
                         }"
                         :style="cell && cell.year ? '--heatmap-opacity: ' + getOpacity(cell.count) : ''"
                         :title="cell && cell.year ? cell.year + ': ' + cell.count + ' games' : ''"
                         @mousedown="cell && cell.year && startDrag(cell.year, $event)"
                         @mouseenter="cell && cell.year && updateDrag(cell.year)"
                         @click.stop="cell && cell.year && (!isDragging || dragStart === cell.year) && selectYear(cell.year, $event)">
                        <span class="year-grid-cell-label" x-text="cell && cell.year ? getYearLabel(cell.year) : ''"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>

</div>
