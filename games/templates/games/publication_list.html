{% extends 'games/base.html' %}

{% block title %} - Publications{% endblock %}

{% block content %}
    <a class="button is-pulled-right" href="{% url 'list-list' %}">View all lists</a>
    <h1 class="title">Publications</h1>
    <table class="table is-fullwidth">
        <thead>
            <tr>
                <th>Publication</th>
                <th>Lists</th>
            </tr>
        </thead>
        <tbody>
            {% for publication in publication_list %}
                <tr>
                    <td>
                        <a href="{% url 'publication-detail' publication.pk %}">{{ publication }}</a>
                    </td>
                    <td>
                        {{ publication.lists.count }}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
