{% extends 'base.html' %}

{% block title %}Page Not Found - Acclaimed Games{% endblock %}

{% block content %}
<div class="container">
    <div class="section">
        <div class="content has-text-centered">
            <h1 class="title is-1 mb-6">404</h1>
            <h2 class="subtitle is-3 mb-5">Page Not Found</h2>
            <p class="is-size-5 mb-5">
                Page with URL <code>{{ request.path }}</code> not found.
            </p>
            <p class="is-size-6 has-text-grey-light">
                Redirecting to games list in <span id="countdown">3</span> seconds...
            </p>
        </div>
    </div>
</div>

<script>
    // Auto-redirect to games list after 3 seconds
    let countdown = 3;
    const countdownElement = document.getElementById('countdown');

    const interval = setInterval(() => {
        countdown--;
        if (countdownElement) {
            countdownElement.textContent = countdown;
        }

        if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = "{% url 'games-list' %}";
        }
    }, 1000);
</script>
{% endblock %}
