{% extends 'base.html' %}
{% load game_filters %}
{% load humanize %}

{% block title %}Source Lists | Acclaimed Video Games{% endblock %}

{% block content %}
<div class="max-w-[860px] mx-auto">
<div id="content" x-data="{
    updateUrl(event) {
        // Get all current filter values from the form
        const yearEl = document.querySelector('[name=year]');
        const typeEl = document.querySelector('[name=type]');
        const sortEl = document.querySelector('#sort-select');

        const year = yearEl ? yearEl.value : '';
        const type = typeEl ? typeEl.value : '';
        const sort = sortEl ? sortEl.value : 'importance';

        const url = new URL(window.location);

        // Update URL parameters based on filter values
        if (year) url.searchParams.set('year', year);
        else url.searchParams.delete('year');

        if (type) url.searchParams.set('type', type);
        else url.searchParams.delete('type');

        // Only add sort if not default
        if (sort && sort !== 'importance') url.searchParams.set('sort', sort);
        else url.searchParams.delete('sort');

        // Reset to page 1 on filter change
        url.searchParams.delete('page');

        window.history.pushState({}, '', url);
    }
}">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-3xl font-bold">Source Lists</h1>
        <a href="#contact"
           class="contact-modal-trigger link link-hover text-base-content/60 hover:text-accent inline-flex items-center gap-1 text-sm"
           data-category="submit_list"
           data-message="I'd like to submit a list for consideration:

List name:
Publication:
URL:
Year published: ">
            <span class="mdi mdi-plus-circle"></span>
            Submit a list
        </a>
    </div>

    <div id="filter-results-wrapper">
        {% include 'lists/includes/_list_list_full.html' %}
    </div>
</div>
</div>

<script nonce="{{ csp_nonce }}">
// Load More handler for publication groups
function initListLoadMore() {
    const container = document.getElementById('results-container');
    if (!container) return;

    const button = container.querySelector('.load-more-button');
    if (!button) return;

    // Remove existing listener to prevent duplicates after DOM updates
    const newButton = button.cloneNode(true);
    button.parentNode.replaceChild(newButton, button);
    newButton.addEventListener('click', handleListLoadMore);
}

async function handleListLoadMore(event) {
    const button = event.currentTarget;
    const nextPage = button.dataset.nextPage;

    if (!nextPage || button.classList.contains('loading')) return;

    // Set loading state
    button.classList.add('loading');
    button.disabled = true;

    // Build URL with current filters + next page + append flag
    const params = new URLSearchParams(window.location.search);
    params.set('page', nextPage);
    params.set('append', 'true');

    const url = window.location.pathname + '?' + params.toString();

    try {
        const response = await fetch(url, {
            cache: 'no-store',
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'HX-Request': 'true'
            }
        });

        if (!response.ok) throw new Error('Failed to load more');

        const html = await response.text();

        // Parse the response to separate groups from metadata
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract metadata
        const metaScript = doc.getElementById('load-more-meta');
        const meta = metaScript ? JSON.parse(metaScript.textContent) : null;

        // Remove the metadata script from the parsed doc
        if (metaScript) metaScript.remove();

        // Append publication groups with staggered animation
        const groupsContainer = document.getElementById('publication-groups-container');
        const appendContainer = doc.getElementById('append-groups-container');
        if (groupsContainer && appendContainer) {
            const newGroups = appendContainer.querySelectorAll('.publication-group');
            let index = 0;
            newGroups.forEach(group => {
                group.classList.add('game-row-enter');
                group.style.animationDelay = `${index * 30}ms`;
                index++;
                groupsContainer.appendChild(group);
                // Initialize Alpine.js on the new element
                if (window.Alpine) {
                    Alpine.initTree(group);
                }
            });
        }

        // Update result summary and button
        if (meta) {
            const loadedCountEl = document.getElementById('loaded-count');
            if (loadedCountEl) {
                loadedCountEl.textContent = meta.loadedCount.toLocaleString();
            }

            const loadedListCountEl = document.getElementById('loaded-list-count');
            if (loadedListCountEl) {
                loadedListCountEl.textContent = meta.totalListCount.toLocaleString();
            }

            button.classList.remove('loading');

            if (!meta.hasMore) {
                const container = button.parentElement;
                container.innerHTML = `
                    <div class="text-base-content/85 text-center">
                        All ${meta.totalCount.toLocaleString()} publications loaded
                    </div>
                `;
            } else {
                button.disabled = false;
                button.dataset.nextPage = meta.nextPage;
                button.dataset.loaded = meta.loadedCount;

                const textSpan = button.querySelector('.load-more-text');
                if (textSpan) {
                    textSpan.textContent = `Load More (${meta.remainingCount.toLocaleString()} remaining)`;
                }
            }
        }

    } catch (err) {
        console.error('Load more error:', err);
        button.classList.remove('loading');
        button.disabled = false;
    }
}

// Initialize on page load (handle case where DOMContentLoaded already fired)
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initListLoadMore);
} else {
    initListLoadMore();
}

// Reinitialize after HTMX swaps (for filter changes)
document.body.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target.id === 'filter-results-wrapper') {
        initListLoadMore();
    }
});
</script>
{% endblock %}
