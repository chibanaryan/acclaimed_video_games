{% load static %}
<nav class="navbar bg-transparent px-0 overflow-visible" role="navigation" aria-label="main navigation"
     x-data="{ expanded: false }">

    {# Left side: Home + Search dropdown + Rankings #}
    <div class="navbar-start gap-2">
        <a href="{% url 'home' %}" class="btn btn-ghost btn-sm">
            Home
        </a>

        {# Search dropdown #}
        <div class="relative" x-data="{
                 showSearchDropdown: false,
                 ...createSearchData('{% url 'api-games-search' %}', 5)
             }"
             x-init="window.addEventListener('reset-search-state', () => { reset(); showSearchDropdown = false; })"
             @click.away="showSearchDropdown = false; q = ''; results = []; showMenu = false">

            {# Search button #}
            <button @click="showSearchDropdown = !showSearchDropdown; $nextTick(() => { if(showSearchDropdown) $refs.searchInputMobile.focus(); })"
                    class="btn btn-ghost btn-sm"
                    aria-label="Search">
                <span class="mdi mdi-magnify text-xl" aria-hidden="true"></span>
            </button>

            {# Search dropdown panel #}
            <div x-show="showSearchDropdown" x-cloak
                 class="fixed left-4 right-4 top-24 bg-base-200 rounded-box shadow-lg z-[99999]">
                <div class="p-4">
                    <div class="relative">
                        <label for="nav-search-mobile" class="sr-only">Search games</label>
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 mdi mdi-magnify text-base-content/50" aria-hidden="true"></span>
                        <input type="text"
                               id="nav-search-mobile"
                               name="q"
                               x-ref="searchInputMobile"
                               x-model="q"
                               @focus="showMenu = true"
                               @input.debounce.300ms="if(q.trim().length >= 2) { loadResults(); } else { results = []; loading = false; }"
                               @keydown.enter="if(q.trim().length >= 2) window.location.href = '{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())"
                               placeholder="Search all games"
                               class="input input-bordered input-sm w-full pl-9 bg-base-100"
                               autocomplete="off">
                    </div>

                    {# Search results #}
                    <div x-show="showMenu" x-cloak class="mt-2 max-h-80 overflow-y-auto">
                        <ul class="menu p-0">
                            <template x-if="!q || q.trim().length < 2">
                                <li class="disabled"><span class="text-base-content/50 text-sm">Please enter two or more characters</span></li>
                            </template>
                            <template x-if="q && q.trim().length >= 2 && !loading && results.length == 0">
                                <li class="disabled"><span class="text-base-content/50 text-sm">No results found</span></li>
                            </template>
                            <template x-for="result in results" :key="result.id">
                                <li>
                                    <a :href="'/game/' + result.slug + '/'" class="flex items-center gap-3">
                                        <img :src="result.thumbnail" :alt="result.name" width="32" height="32" class="w-8 h-8 rounded">
                                        <div>
                                            <div class="font-semibold text-sm" x-text="result.name + ' (' + result.year_of_release + ')'"></div>
                                            <div class="text-xs text-base-content/70" x-text="'All time rank: ' + result.rank"></div>
                                        </div>
                                    </a>
                                </li>
                            </template>
                            <template x-if="q && q.trim().length >= 2 && !loading && results.length > 0">
                                <li>
                                    <a :href="'{% url 'games-list' %}?q=' + encodeURIComponent(q.trim())" class="link link-primary text-sm">
                                        See all results &hellip;
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <a href="{% url 'games-list' %}" class="btn btn-ghost btn-sm">
            Rankings
        </a>
    </div>

    {# Right side: Hamburger menu #}
    <div class="navbar-end">
        <div @click.away="expanded = false">
            <button type="button" @click="expanded = !expanded" class="btn btn-ghost btn-sm"
                   aria-label="menu" :aria-expanded="expanded">
                <span class="mdi mdi-menu text-xl" x-show="!expanded"></span>
                <span class="mdi mdi-close text-xl" x-show="expanded" x-cloak></span>
            </button>
            <ul x-show="expanded" x-cloak
                x-transition:enter="transition ease-out duration-100"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-75"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                class="fixed top-[60px] menu bg-base-200 rounded-box w-52 p-2 shadow-lg origin-top-right"
                style="z-index: 99999; right: 1rem;"
                @click="expanded = false">
                <li><a href="{% url 'developers-list' %}">Developers</a></li>
                <li><a href="{% url 'list-list' %}">Lists</a></li>
                <li><a href="{% url 'post-list' %}">News</a></li>
                <li><a href="{% url 'page-detail' slug='about' %}">About</a></li>
                <li><label for="contactModalToggle" @click="expanded = false">Contact Us</label></li>
                <li><a href="{% url 'page-detail' slug='donate' %}">Donate</a></li>
                <li class="menu-title mt-2">Theme</li>
                <li>
                    <label class="flex cursor-pointer gap-2 items-center" @click.stop>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5" />
                            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
                        </svg>
                        <input type="checkbox" value="synthwave" class="toggle theme-controller theme-loading" id="theme-toggle-mobile" />
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </label>
                </li>
            </ul>
        </div>
    </div>
</nav>
